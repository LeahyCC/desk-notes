name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish both exes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $common = @('-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', "-p:Version=$version")

          # Compression is what keeps the standalone exe near 70 MB. Without it, it comes out at 155 MB.
          dotnet publish @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/standalone
          dotnet publish @common --self-contained false -o out/needs-dotnet

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/standalone/DeskNotes.exe "dist/DeskNotes-$version-win-x64.exe"
          Copy-Item out/needs-dotnet/DeskNotes.exe "dist/DeskNotes-$version-win-x64-needs-dotnet10.exe"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = @(Get-Content CHANGELOG.md)
          $pattern = '^## \[' + [regex]::Escape($version) + '\]'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $pattern) { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }

          $notes = [System.Collections.Generic.List[string]]::new()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ' -or $lines[$i] -match '^\[[^\]]+\]:') { break }
            $notes.Add($lines[$i])
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) { throw "CHANGELOG.md section for $version is empty" }
          Set-Content -Path release-notes.md -Value $text -Encoding utf8

          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.exe).FullName --title "${{ github.ref_name }}" --notes-file release-notes.md
