name: Feature request
description: An idea for something DeskNotes should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, not the solution. What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: pr
    attributes:
      label: Help
      options:
        - label: I would like to open a pull request for this
